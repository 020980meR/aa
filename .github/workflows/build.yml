name: Build Unsigned IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project Base44App.xcodeproj \
            -scheme Base44App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Base44App.app Payload/
          zip -r Base44App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Base44App-IPA
          path: Base44App.ipa
